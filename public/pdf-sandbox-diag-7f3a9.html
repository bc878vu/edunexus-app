<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PDF Sandbox Diagnostic</title>
<style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px}iframe{width:100%;height:380px;border:3px solid #333;display:block;background:#fff}h2{background:#eef;padding:8px;font-size:1rem}</style>
</head><body>
<h1>PDF Sandbox Diagnostic (temporary)</h1>

<h2>CASE A: NO sandbox, direct Supabase PDF URL</h2>
<iframe id="caseA" src="https://cprpndovdfnkvekewstv.supabase.co/storage/v1/object/public/edunexus-public-files/4cHukNPAOtS37XADooS7IR0BUmu1/c30abefb-8358-41a6-a177-107eecf283fa/CS609_Mid_Term_MCQs_EduNexus.pdf"></iframe>

<h2>CASE B: NO sandbox, blob URL (JS fetch)</h2>
<iframe id="caseB"></iframe>

<h2>CASE C: sandbox="allow-scripts allow-same-origin", direct URL (control)</h2>
<iframe id="caseC" src="https://cprpndovdfnkvekewstv.supabase.co/storage/v1/object/public/edunexus-public-files/4cHukNPAOtS37XADooS7IR0BUmu1/c30abefb-8358-41a6-a177-107eecf283fa/CS609_Mid_Term_MCQs_EduNexus.pdf" sandbox="allow-scripts allow-same-origin"></iframe>

<h2>CASE D: sandbox="allow-scripts allow-same-origin", blob URL (JS fetch)</h2>
<iframe id="caseD" sandbox="allow-scripts allow-same-origin"></iframe>

<script>
var pdfUrl = "https://cprpndovdfnkvekewstv.supabase.co/storage/v1/object/public/edunexus-public-files/4cHukNPAOtS37XADooS7IR0BUmu1/c30abefb-8358-41a6-a177-107eecf283fa/CS609_Mid_Term_MCQs_EduNexus.pdf";
fetch(pdfUrl, {mode: 'cors'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.blob(); }).then(function(blob){
  var url = URL.createObjectURL(blob);
  document.getElementById('caseB').src = url;
  document.getElementById('caseD').src = url;
  document.title = "blob ready: " + blob.type + " " + blob.size;
}).catch(function(e){
  document.title = "fetch failed: " + e.message;
});
</script>
</body></html>
