name: EduNexus navigation and production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  navigation-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Test shared navigation, route overlays and cache strategy
        run: node --test scripts/navigation-regression.test.mjs
      - name: Verify one SEO owner and canonical routes across SPA and SSR
        run: node --test tests/seoCanonical.test.mjs
      - name: Preserve math, programming code and safe uploaded text
        run: node --test tests/richContent.test.mjs
      - name: Verify Academic Hub upload, preview and security headers
        run: node --test tests/academicSecurityHardening.test.mjs
      - name: Install dependencies using the project's existing Vercel install command
        run: npm install --no-audit --no-fund
      - name: Verify the complete production build
        run: CI=false npm run build
