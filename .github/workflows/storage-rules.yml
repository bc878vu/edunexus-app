name: Firebase Storage rules security

on:
  push:
    branches: [main]
    paths:
      - storage.rules
      - firebase.json
      - tests/storage-rules.emulator.test.mjs
      - .github/workflows/storage-rules.yml
  pull_request:
    branches: [main]
    paths:
      - storage.rules
      - firebase.json
      - tests/storage-rules.emulator.test.mjs
      - .github/workflows/storage-rules.yml

permissions:
  contents: read

jobs:
  storage-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase rules test tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-tools@14.22.0 @firebase/rules-unit-testing@4.0.1
      - name: Compile rules and verify student, public, and admin permissions in the emulator
        run: ./node_modules/.bin/firebase emulators:exec --project demo-edunexus-storage --only storage --config firebase.json "node --test tests/storage-rules.emulator.test.mjs"
