name: Fix AI Quiz Source Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch quiz frontend and backend
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.js')
          text = app.read_text(encoding='utf-8')

          old_state = """  const [timeLeft, setTimeLeft] = useState(90);\n  const [fileName, setFileName] = useState('');\n\n  const handleFileUpload = (e) => {\n    const file = e.target.files[0];\n    if (file) {\n      setFileName(file.name);\n      if (file.type === \"text/plain\") {\n        const reader = new FileReader();\n        reader.onload = (ev) => {\n          setInput(ev.target.result.substring(0, 5000)); // Limit to 5000 chars for prompt safety\n        };\n        reader.readAsText(file);\n      } else {\n        setInput(`Create a quiz about ${file.name}`);\n      }\n    }\n  };"""
          new_state = """  const [timeLeft, setTimeLeft] = useState(90);\n  const [fileName, setFileName] = useState('');\n  const [fileUrl, setFileUrl] = useState('');\n  const [fileMimeType, setFileMimeType] = useState('');\n  const [fileUploading, setFileUploading] = useState(false);\n\n  const handleFileUpload = async (e) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n\n    const allowed = /\\.(txt|md|csv|pdf|doc|docx|ppt|pptx|xls|xlsx)$/i.test(file.name);\n    if (!allowed) {\n      showToast(\"Unsupported file. Use PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, TXT or MD.\", \"error\");\n      return;\n    }\n\n    if (file.size > 8 * 1024 * 1024) {\n      showToast(\"File is too large. Maximum AI Quiz source size is 8 MB.\", \"error\");\n      return;\n    }\n\n    setFileName(file.name);\n    setFileMimeType(file.type || 'application/octet-stream');\n    setFileUploading(true);\n    try {\n      // Upload the exact selected file to Firebase Storage so the server can\n      // ingest the original PDF/PPT/DOCX instead of only receiving its name.\n      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');\n      const objectRef = storageRef(storage, `ai-quiz-sources/${user?.uid || 'anonymous'}/${Date.now()}-${safeName}`);\n      await uploadBytes(objectRef, file, { contentType: file.type || undefined });\n      const url = await getDownloadURL(objectRef);\n      setFileUrl(url);\n\n      // Text files can still be previewed in the input for convenience, but\n      // the canonical source remains the uploaded file URL.\n      if (file.type === 'text/plain' || /\\.(txt|md|csv)$/i.test(file.name)) {\n        const reader = new FileReader();\n        reader.onload = (ev) => setInput(String(ev.target?.result || '').slice(0, 12000));\n        reader.readAsText(file);\n      } else if (!input.trim()) {\n        setInput(file.name.replace(/\\.[^.]+$/, ''));\n      }\n\n      showToast(\"File attached to AI Quiz source engine.\", \"success\");\n    } catch (error) {\n      console.error(\"AI Quiz file upload error:\", error);\n      setFileUrl('');\n      showToast(\"Could not upload the quiz source file. Please try again.\", \"error\");\n    } finally {\n      setFileUploading(false);\n    }\n  };"""
          if old_state not in text:
              raise SystemExit('Quiz upload block not found')
          text = text.replace(old_state, new_state, 1)

          old_generate = """    const prompt = `Generate a valid JSON array of ${limit} multiple choice questions based on the following text or topic: \"${input.substring(0, 2000)}\". \n    Style: Short, conceptual questions similar to Virtual University (VU) exam pattern.\n    Format: [{\"id\": 1, \"q\": \"Question text?\", \"options\": [\"Option A\", \"Option B\", \"Option C\", \"Option D\"], \"ans\": 0, \"explanation\": \"Short summary explanation.\"}]. \n    Return ONLY the raw JSON array. No markdown.`;"""
          new_generate = """    const sourceRequest = fileUrl\n      ? `\nSOURCE_FILE_URL: ${fileUrl}\nSOURCE_FILE_NAME: ${fileName}\nSOURCE_FILE_MIME: ${fileMimeType || 'application/octet-stream'}\nIMPORTANT: The uploaded file is the primary source. Read the actual file, not merely its filename.\n`\n      : '';\n\n    const prompt = `Generate exactly ${limit} multiple choice questions for the student's requested subject/source.\n\nSTRICT SOURCE RULES:\n- If SOURCE_FILE_URL is present, use that uploaded file as the primary and authoritative source.\n- If the uploaded file already contains MCQs, extract those exact MCQs first: preserve exact question wording, exact four option texts, exact option order, and the source-supported correct answer. Do not paraphrase them.\n- If the source is a handout, lecture notes, PPT/slides, DOC/DOCX or other study material without enough ready-made MCQs, create exam-likely MCQs only from facts explicitly present in that source.\n- If a subject/course is supplied, use matching EduNexus files for that exact course too; never substitute an unrelated course.\n- When several related files are available, prioritize questions/concepts repeated across them and questions appearing in quizzes/question banks/past papers.\n- Never use outside knowledge to fill a missing answer. Skip unsupported questions instead.\n- Every question must have exactly 4 options and exactly one correct answer.\n\nSTUDENT TOPIC/TEXT: ${input.substring(0, 12000)}\n${sourceRequest}\n\nReturn ONLY raw JSON in this exact shape:\n[{\"id\":1,\"q\":\"...\",\"options\":[\"...\",\"...\",\"...\",\"...\"],\"ans\":0,\"explanation\":\"Short source-grounded explanation\",\"source\":\"source title\"}]`;"""
          if old_generate not in text:
              raise SystemExit('Quiz generation prompt block not found')
          text = text.replace(old_generate, new_generate, 1)

          old_button = """            <button onClick={generateQuiz} disabled={loading || !input.trim()} className=\"w-full bg-gradient-to-r from-cyan-600 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 hover:shadow-xl\">{loading ? <Loader className=\"animate-spin h-5 w-5\" /> : <PlayCircle className=\"h-5 w-5\" />} {loading ? \"Generating Quiz...\" : \"Start AI Quiz\"}</button>"""
          new_button = """            <button onClick={generateQuiz} disabled={loading || fileUploading || (!input.trim() && !fileUrl)} className=\"w-full bg-gradient-to-r from-cyan-600 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 hover:shadow-xl\">{loading || fileUploading ? <Loader className=\"animate-spin h-5 w-5\" /> : <PlayCircle className=\"h-5 w-5\" />} {fileUploading ? \"Uploading Source...\" : loading ? \"Generating Quiz...\" : \"Start AI Quiz\"}</button>"""
          if old_button not in text:
              raise SystemExit('Quiz button block not found')
          text = text.replace(old_button, new_button, 1)

          old_input = """              <input value={input} onChange={e => setInput(e.target.value)} className={`flex-1 ${theme.input} rounded-xl p-4 ${theme.text} outline-none`} placeholder=\"e.g. 'CS101' or paste text...\" />"""
          new_input = """              <input value={input} onChange={e => setInput(e.target.value)} className={`flex-1 ${theme.input} rounded-xl p-4 ${theme.text} outline-none`} placeholder=\"e.g. CS620, subject name, or paste text...\" />"""
          if old_input not in text:
              raise SystemExit('Quiz input block not found')
          text = text.replace(old_input, new_input, 1)

          old_file = """            <div className={`border-2 border-dashed ${theme.border} rounded-xl p-4 text-center cursor-pointer relative hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors`}>\n              <input type=\"file\" onChange={handleFileUpload} className=\"absolute inset-0 opacity-0 cursor-pointer\" accept=\".txt,.pdf,.doc,.docx\" />\n              <div className=\"flex flex-col items-center gap-2\">\n                <Upload className=\"text-indigo-500\" />\n                <span className={theme.textMuted}>{fileName || \"Click to Upload File (Text/PDF)\"}</span>\n              </div>\n            </div>"""
          new_file = """            <div className={`border-2 border-dashed ${theme.border} rounded-xl p-4 text-center cursor-pointer relative hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors`}>\n              <input type=\"file\" onChange={handleFileUpload} onClick={(e) => { e.target.value = null; }} className=\"absolute inset-0 opacity-0 cursor-pointer\" accept=\".txt,.md,.csv,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx\" />\n              <div className=\"flex flex-col items-center gap-2\">\n                <Upload className={fileUrl ? \"text-green-500\" : \"text-indigo-500\"} />\n                <span className={theme.textMuted}>{fileName || \"Upload PDF / PPT / DOCX / XLSX / TXT\"}</span>\n                <span className={`text-xs ${theme.textMuted}`}>{fileUrl ? \"Source attached ✓ — AI will read the actual file\" : \"File is uploaded to the secure source pipeline\"}</span>\n              </div>\n            </div>"""
          if old_file not in text:
              raise SystemExit('Quiz file input block not found')
          text = text.replace(old_file, new_file, 1)

          app.write_text(text, encoding='utf-8')

          api = Path('api/gemini-v2.mjs')
          b = api.read_text(encoding='utf-8')

          b = b.replace("const MAX_FILE_CANDIDATES = 80;", "const MAX_FILE_CANDIDATES = 250;")
          b = b.replace("const MAX_SOURCE_FILES = 6;", "const MAX_SOURCE_FILES = 12;")

          marker = "function grounded(p) { return isQuiz(p) || isFlashcard(p); }"
          if marker not in b:
              raise SystemExit('Backend grounded marker not found')

          insert = r'''
function extractSourceFile(prompt) {
  const p = String(prompt || '');
  const url = (p.match(/SOURCE_FILE_URL:\s*(https?:\/\/[^\s\n]+)/i) || [])[1] || '';
  const name = (p.match(/SOURCE_FILE_NAME:\s*([^\n]+)/i) || [])[1]?.trim() || '';
  const mime = (p.match(/SOURCE_FILE_MIME:\s*([^\n]+)/i) || [])[1]?.trim() || 'application/octet-stream';
  return { url, name, mime };
}
function explicitCourseTokens(prompt) {
  const p = String(prompt || '').toUpperCase();
  const out = new Set();
  for (const m of p.matchAll(/\b(?:CS|MGT|MTH|PHY|ENG|ISL|PAK|IT|SE|STA|ECO|ACC|FIN|HRM|PSY|BIO|CHE|EDU)\s*[-]?\s*\d{3}\b/g)) {
    out.add(m[0].replace(/\s+/g, '').replace('-', ''));
  }
  return [...out];
}
function normalizedQuestion(q) {
  return String(q || '').toLowerCase().replace(/\s+/g, ' ').replace(/[^a-z0-9 ]/g, '').trim();
}
function parseJsonArray(text) {
  const cleaned = String(text || '').replace(/```json/gi, '').replace(/```/g, '').trim();
  const start = cleaned.indexOf('[');
  const end = cleaned.lastIndexOf(']');
  if (start < 0 || end < start) return null;
  try { return JSON.parse(cleaned.slice(start, end + 1)); } catch (_) { return null; }
}
function validateQuizArray(items) {
  if (!Array.isArray(items)) return [];
  const seen = new Set();
  return items.map((q, i) => {
    if (!q || typeof q !== 'object') return null;
    const options = Array.isArray(q.options) ? q.options.map(x => String(x ?? '').trim()) : [];
    const ans = Number(q.ans);
    const question = String(q.q || '').trim();
    if (!question || options.length !== 4 || options.some(x => !x) || !Number.isInteger(ans) || ans < 0 || ans > 3) return null;
    const key = normalizedQuestion(question);
    if (seen.has(key)) return null;
    seen.add(key);
    return { id: i + 1, q: question, options, ans, explanation: String(q.explanation || '').trim(), source: String(q.source || '').trim() };
  }).filter(Boolean);
}
'''
          b = b.replace(marker, marker + insert, 1)

          start = b.index('function scoreFile(file, prompt) {')
          end = b.index('\nasync function fetchLiveFiles()', start)
          new_score = r'''function scoreFile(file, prompt) {
  const hay = [file.title,file.name,file.fileName,file.subject,file.course,file.code,file.category,file.description,file.text,file.storagePath].map(v => String(v || '').toLowerCase()).join(' ');
  const tokens = termsOf(prompt);
  const p = String(prompt || '').toLowerCase();
  const courses = explicitCourseTokens(prompt).map(x => x.toLowerCase());
  const fileCourse = String(file.course || file.subject || file.code || '').replace(/\s+/g, '').toLowerCase();
  const fileHay = hay.replace(/\s+/g, '');
  if (courses.length && !courses.some(c => fileCourse.includes(c) || fileHay.includes(c))) return -1000;
  let score = 0;
  for (const term of tokens) if (term.length >= 3 && hay.includes(term)) score += term.length >= 4 ? 2 : 1;
  if (courses.length && courses.some(c => fileCourse.includes(c) || fileHay.includes(c))) score += 30;
  if (file.title && p.includes(String(file.title).toLowerCase())) score += 20;
  if (/quiz|mcq|question|past paper|handout|lecture|notes|slides|ppt|pdf/.test(hay)) score += 2;
  return score;
}'''
          b = b[:start] + new_score + b[end:]

          start = b.index('async function downloadSource(file, apiKey) {')
          end = b.index('\nasync function buildSources', start)
          new_download = r'''async function downloadSource(file, apiKey) {
  if (file.text) return { ok:true, text:`SOURCE DOCUMENT: ${file.title}\nCourse/Subject: ${file.course || file.subject || file.code || 'N/A'}\nSOURCE TEXT:\n${String(file.text).slice(0, 90000)}`, bytes:0 };
  if (!file.url) return { ok:false, error:`No source URL for ${file.title}` };
  try {
    const r = await fetch(file.url, { signal: AbortSignal.timeout(9000) });
    if (!r.ok) throw new Error(`source ${r.status}`);
    const buf = await r.arrayBuffer();
    if (buf.byteLength > MAX_SOURCE_BYTES) throw new Error('source exceeds safe ingestion size');
    const ct = String(r.headers.get('content-type') || file.contentType || '').toLowerCase();
    const isPdf = ct.includes('pdf') || /\.pdf(?:$|\?)/i.test(file.url);
    const isText = ct.startsWith('text/') || /json|csv|xml|html|markdown/i.test(ct) || /\.(txt|csv|json|md|html?)(?:$|\?)/i.test(file.url);
    if (isPdf) return { ok:true, parts:[{text:`SOURCE DOCUMENT: ${file.title}\nCourse/Subject: ${file.course || file.subject || file.code || 'N/A'}\n`},{inlineData:{mimeType:'application/pdf',data:Buffer.from(buf).toString('base64')}}], bytes:buf.byteLength };
    const office = /presentationml\.presentation|wordprocessingml\.document|spreadsheetml\.sheet|application\/vnd\.ms-powerpoint|application\/msword/i.test(ct) || /\.(pptx?|docx?|xlsx?)(?:$|\?)/i.test(file.url);
    if (office) {
      const uploaded = await uploadGeminiFile(apiKey, buf, ct || 'application/octet-stream', file.fileName || file.title);
      if (!uploaded?.uri) throw new Error('Gemini file upload returned no URI');
      return { ok:true, fileData:{mimeType:uploaded.mimeType || ct, fileUri:uploaded.uri}, bytes:buf.byteLength };
    }
    if (isText) return { ok:true, text:`SOURCE DOCUMENT: ${file.title}\nCourse/Subject: ${file.course || file.subject || file.code || 'N/A'}\nSOURCE TEXT:\n${Buffer.from(buf).toString('utf8').slice(0,90000)}`, bytes:buf.byteLength };
    throw new Error(`unsupported source type ${ct || 'unknown'}`);
  } catch (error) { return { ok:false, error:error?.message || 'source ingestion failed' }; }
}'''
          b = b[:start] + new_download + b[end:]

          start = b.index('async function buildSources(prompt, apiKey) {')
          end = b.index('\n\nexport default async function handler', start)
          new_build = r'''async function buildSources(prompt, apiKey) {
  const files = await fetchLiveFiles();
  const direct = extractSourceFile(prompt);
  const ranked = files.map(file => ({file, score:scoreFile(file,prompt)})).filter(x => x.score > 0).sort((a,b) => b.score - a.score);
  const selected = ranked.slice(0, MAX_SOURCE_FILES);
  const directFile = direct.url ? { id:'direct-upload', title:direct.name || 'Uploaded quiz source', name:direct.name || '', fileName:direct.name || '', subject:'', course:'', code:'', category:'AI Quiz upload', description:'Directly uploaded by student for this quiz', contentType:direct.mime, url:direct.url, storagePath:'' } : null;
  const candidates = directFile ? [{file:directFile,score:100000}, ...selected] : selected;
  const parts = [];
  const selectedMeta = [];
  let total = 0;
  for (const item of candidates) {
    if (total >= MAX_TOTAL_SOURCE_BYTES) break;
    const got = await downloadSource(item.file, apiKey);
    if (!got.ok) {
      if (directFile && item.file.id === 'direct-upload') return {selected:[],parts:[],sourceNames:[],fatal:got.error};
      continue;
    }
    total += got.bytes || 0;
    if (got.parts) parts.push(...got.parts); else if (got.fileData) parts.push(got.fileData); else if (got.text) parts.push({text:got.text});
    selectedMeta.push({title:item.file.title,fileName:item.file.fileName || '',contentType:item.file.contentType || '',course:item.file.course || item.file.subject || item.file.code || '',score:item.score});
  }
  if (grounded(prompt) && !parts.length) return {selected:[],parts:[],sourceNames:[],fatal:'No usable uploaded source was found for this quiz request.'};
  return {selected:selectedMeta,parts,sourceNames:selectedMeta.map(x=>x.title),fatal:''};
}'''
          b = b[:start] + new_build + b[end:]

          old_gate = """  const sources = await buildSources(prompt, apiKey);\n  if (isGrounded && !sources.selected.length) return res.status(422).json({error:'No matching uploaded EduNexus handout/file was found for this topic. Upload or select the course material first.'});"""
          new_gate = """  const sources = await buildSources(prompt, apiKey);\n  if (isGrounded && (!sources.selected.length || sources.fatal)) return res.status(422).json({error:sources.fatal || 'No usable matching EduNexus source was found for this quiz request.'});"""
          if old_gate not in b:
              raise SystemExit('Backend handler source gate not found')
          b = b.replace(old_gate, new_gate, 1)

          old_return = """    if (!text) return res.status(502).json({error:'The AI provider returned no text.'});\n    return res.status(200).json({text, sources:sources.selected});"""
          new_return = """    if (!text) return res.status(502).json({error:'The AI provider returned no text.'});\n    if (isQuiz(prompt)) {\n      const validated = validateQuizArray(parseJsonArray(text));\n      if (!validated.length) return res.status(502).json({error:'The AI provider returned no source-grounded quiz questions.'});\n      return res.status(200).json({text:JSON.stringify(validated), sources:sources.selected});\n    }\n    return res.status(200).json({text, sources:sources.selected});"""
          if old_return not in b:
              raise SystemExit('Backend return block not found')
          b = b.replace(old_return, new_return, 1)

          api.write_text(b, encoding='utf-8')
          print('patched frontend and backend')

      - name: Validate JavaScript syntax
        run: |
          node --check api/gemini-v2.mjs

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js api/gemini-v2.mjs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix AI Quiz direct file ingestion and strict source grounding"
          git push origin main
