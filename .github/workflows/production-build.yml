name: EduNexus production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Mirror vercel.json installCommand; current lockfile needs npm's resolution of yaml.
      - name: Install dependencies as Vercel does
        run: npm install --no-audit --no-fund
      - name: Verify branded reviews and signed storage uploads
        run: npm test -- --watch=false --runInBand reviewQuality.test.js examReviewFormat.test.js signedObjectUpload.test.js examMcqImport.test.js examPractice.test.js examAnswerFeedback.test.js examCatalog.test.js edubotKnowledge.test.js edubotPresentation.test.js adminSession.test.js ExamPrepHub.security.test.js ExamPaperCommunity.test.js
        env:
          CI: 'true'
      - name: Verify unified navigation and direct page routes
        run: node --test scripts/navigation-regression.test.mjs
      - name: Verify indexable resource pages and secured file endpoints
        run: node --test tests/resourceSeo.test.mjs tests/adsenseReadiness.test.mjs
      # Match the Vercel build environment: CRA reports pre-existing lint warnings
      # without treating them as fatal. This check still fails on compilation errors.
      - name: Verify Vercel-compatible production build
        run: npm run build
        env:
          CI: 'false'
