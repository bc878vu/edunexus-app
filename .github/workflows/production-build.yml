name: EduNexus production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Mirror vercel.json installCommand; current lockfile needs npm's resolution of yaml.
      - name: Install dependencies as Vercel does
        run: npm install --no-audit --no-fund
      # Match the Vercel build environment: CRA reports pre-existing lint warnings
      # without treating them as fatal. This check still fails on compilation errors.
      - name: Verify Vercel-compatible production build
        run: npm run build
        env:
          CI: 'false'
